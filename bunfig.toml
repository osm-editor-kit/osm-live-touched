# From the FMC tech-stack template (references/bun-install.md).

# Supply-chain cooldown — only install versions published at least N seconds ago.
# Our own packages (published from our repos with provenance) are exempt, so a fresh
# release can be used right away.
# @see https://bun.com/docs/runtime/bunfig#install-minimumreleaseage
[install]
minimumReleaseAge = 432000 # 5 days (5 × 24 × 60 × 60 seconds)
minimumReleaseAgeExcludes = [
  "typescript",
  "@typescript/typescript-darwin-arm64",
  "@typescript/typescript-linux-x64",
  "@osm-editor-kit/key-value-db-client",
]

# Global virtual store — install once, link everywhere (requires isolated linker). Local/dev only.
# @see https://bun.com/docs/pm/global-store
linker = "isolated"
globalStore = true
